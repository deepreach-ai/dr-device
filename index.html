  <style>:root {
  --ink: #06101a;
  --night: #04070b;
  --night-soft: #0a1119;
  --paper: #eef3f7;
  --white: #f7fbff;
  --blue: #218cff;
  --blue-deep: #1268ff;
  --cyan: #65c6ff;
  --orange: #ff6a1a;
  --muted: #8292a3;
  --line: rgba(255, 255, 255, 0.14);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--night); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button, a { -webkit-tap-highlight-color: transparent; }
::selection { background: var(--blue); color: white; }

.site-header {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  height: 88px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 clamp(24px, 4vw, 72px);
  color: white;
  border-bottom: 1px solid rgba(255,255,255,.13);
}
.brand { display: inline-flex; align-items: center; width: max-content; line-height: 0; }
.brand-logo { width: clamp(104px, 8vw, 126px); height: auto; }
.desktop-nav { display: flex; gap: 34px; font-size: 13px; color: #aeb8c3; }
.desktop-nav a { transition: color .25s ease; }
.desktop-nav a:hover { color: white; }
.header-actions { justify-self: end; display: flex; align-items: center; gap: 10px; }
.language-switch {
  display: inline-flex;
  align-items: center;
  padding: 3px;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 999px;
  background: rgba(3,8,13,.36);
  backdrop-filter: blur(12px);
}
.language-switch button {
  min-width: 35px;
  height: 31px;
  padding: 0 9px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: #8fa0b1;
  font: inherit;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: color .2s ease, background .2s ease;
}
.language-switch button:hover { color: white; }
.language-switch button.active { color: var(--night); background: white; }
.header-cta {
  padding: 12px 17px;
  border: 1px solid rgba(255,255,255,.28);
  border-radius: 999px;
  font-size: 13px;
  transition: background .25s, border-color .25s;
}
.header-cta:hover { background: white; border-color: white; color: var(--night); }

.hero {
  position: relative;
  min-height: 100svh;
  overflow: hidden;
  padding: 150px clamp(24px, 7vw, 120px) 150px;
  display: flex;
  align-items: center;
  background: #000;
  color: white;
}
.hero::after {
  content: "";
  position: absolute;
  inset: auto 0 0;
  height: 36%;
  background: linear-gradient(transparent, rgba(0,0,0,.94));
  pointer-events: none;
}
.hero-grid {
  position: absolute;
  inset: 0;
  opacity: .16;
  background-image: linear-gradient(rgba(255,255,255,.08) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.08) 1px, transparent 1px);
  background-size: 84px 84px;
  mask-image: linear-gradient(to right, black, transparent 70%);
}
.hero-copy { position: relative; z-index: 4; width: min(620px, 47vw); }
.eyebrow, .kicker {
  margin: 0 0 24px;
  text-transform: uppercase;
  letter-spacing: .16em;
  font-size: 14px;
  font-weight: 700;
  color: #73869a;
}
.eyebrow { display: flex; align-items: center; color: #95a8ba; }
.eyebrow span { width: 36px; height: 1px; background: var(--blue); margin-right: 12px; }
.hero h1 { width: min(590px, 43vw); margin: 0; line-height: 0; }
.hero-logo { width: 100%; height: auto; }
.hero-lead { margin: 50px 0 18px; font-size: clamp(34px, 3.5vw, 59px); line-height: 1.08; letter-spacing: -.055em; font-weight: 680; }
.hero-description { max-width: 530px; margin: 0; color: #9dabb8; font-size: 16px; line-height: 1.8; }
.hero-actions { margin-top: 36px; display: flex; gap: 12px; flex-wrap: wrap; }
.button-primary, .button-ghost {
  min-height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 32px;
  padding: 0 24px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 650;
  transition: transform .25s ease, background .25s ease, border-color .25s ease;
}
.button-primary { background: var(--blue); color: white; }
.button-primary:hover { transform: translateY(-2px); background: #43a1ff; }
.button-ghost { color: white; border: 1px solid rgba(255,255,255,.25); }
.button-ghost:hover { transform: translateY(-2px); border-color: white; }
.commerce-actions {
  width: min(480px, 100%);
  margin-top: 14px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.commerce-button {
  position: relative;
  min-height: 68px;
  padding: 13px 17px;
  display: grid;
  grid-template-columns: 1fr auto;
  grid-template-rows: auto auto;
  align-items: center;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 5px;
  color: white;
  transition: transform .25s ease, border-color .25s ease, background .25s ease;
}
.commerce-button::before {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, rgba(255,255,255,.1), transparent 42%);
  pointer-events: none;
}
.commerce-button span { position: relative; z-index: 1; font-size: 16px; font-weight: 700; }
.commerce-button strong { position: relative; z-index: 1; grid-row: 2; color: #8495a6; font-size: 9px; letter-spacing: .16em; }
.commerce-button i { position: relative; z-index: 1; grid-column: 2; grid-row: 1 / span 2; font-style: normal; font-size: 18px; }
.commerce-button:hover { transform: translateY(-2px); border-color: rgba(255,255,255,.55); }
.commerce-rent { background: rgba(255,255,255,.055); backdrop-filter: blur(10px); }
.commerce-buy { border-color: rgba(255,106,26,.78); background: rgba(255,106,26,.92); }
.commerce-buy strong { color: rgba(255,255,255,.7); }
.commerce-buy:hover { border-color: #ff9a61; background: #ff7a32; }
.hero-visual { position: absolute; z-index: 2; inset: 8% -6% 9% 44%; }
.hero-visual::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, #000 0%, transparent 17%, transparent 77%, #000 100%), linear-gradient(0deg, #000 0%, transparent 22%);
  pointer-events: none;
}
.hero-visual img { width: 100%; height: 100%; object-fit: cover; object-position: 52% center; filter: saturate(.9) contrast(1.06) brightness(.8); }
.fov-ring { position: absolute; z-index: 2; border: 1px solid rgba(78,170,255,.35); border-radius: 50%; pointer-events: none; }
.ring-one { width: 520px; height: 520px; left: 37%; top: 15%; animation: pulse-ring 5s ease-in-out infinite; }
.ring-two { width: 690px; height: 690px; left: 27%; top: 4%; opacity: .35; animation: pulse-ring 5s ease-in-out 1s infinite; }
@keyframes pulse-ring { 0%,100% { transform: scale(.97); opacity:.24; } 50% { transform: scale(1.02); opacity:.62; } }
.sensor-label { position: absolute; z-index: 5; display: grid; gap: 4px; padding-left: 12px; border-left: 2px solid var(--blue); }
.sensor-label span { font-size: 9px; letter-spacing: .16em; color: #88a2b9; }
.sensor-label strong { font-size: 15px; letter-spacing: .02em; }
.label-camera { right: 17%; top: 25%; }
.label-sync { left: 30%; bottom: 18%; }
.hero-metrics {
  position: absolute;
  z-index: 6;
  bottom: 0;
  left: clamp(24px, 7vw, 120px);
  right: clamp(24px, 7vw, 120px);
  min-height: 108px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 1px solid rgba(255,255,255,.17);
}
.hero-metrics div { display: flex; flex-direction: column; justify-content: center; padding-left: 28px; border-right: 1px solid rgba(255,255,255,.12); }
.hero-metrics div:first-child { padding-left: 0; }
.hero-metrics div:last-child { border: 0; }
.hero-metrics strong { font-size: 21px; letter-spacing: .03em; }
.hero-metrics span { margin-top: 8px; color: #718297; font-size: 14px; }

.signal-strip {
  min-height: 60px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(18px, 3vw, 52px);
  padding: 16px 24px;
  overflow: hidden;
  background: var(--blue);
  color: white;
  font-size: 14px;
  font-weight: 750;
  letter-spacing: .12em;
  white-space: nowrap;
}
.signal-strip i { width: 4px; height: 4px; background: white; border-radius: 50%; opacity: .55; }
.section-pad { padding: 140px clamp(24px, 7vw, 120px); }
.section-heading { display: grid; grid-template-columns: 1.4fr .8fr; gap: 80px; align-items: end; margin-bottom: 76px; }
.section-heading h2, .workflow h2, .specifications h2, .final-cta h2 { margin: 0; font-size: clamp(42px, 5.2vw, 78px); line-height: 1.08; letter-spacing: -.06em; font-weight: 660; }
.section-heading > p { max-width: 510px; margin: 0; color: #596979; font-size: 16px; line-height: 1.85; }
.feature-grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 300px; gap: 14px; }
.feature-card {
  position: relative;
  overflow: hidden;
  padding: 28px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background: #f8fbfd;
  border: 1px solid #dbe3e9;
  border-radius: 4px;
  transition: transform .35s ease, box-shadow .35s ease;
}
.feature-card:hover { transform: translateY(-5px); box-shadow: 0 24px 50px rgba(13,35,55,.09); }
.feature-wide { grid-column: span 2; }
.feature-full { grid-column: span 3; }
.feature-tall { grid-row: span 2; background: var(--night); color: white; }
.feature-blue { color: white; background: linear-gradient(135deg, #0575ff, #0042a6); border-color: transparent; }
.feature-blue::after { content:""; position:absolute; width:240px; height:240px; border:1px solid rgba(255,255,255,.25); border-radius:50%; right:-55px; top:-45px; }
.feature-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: #8c9aa8; }
.feature-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 6px rgba(33,140,255,.12); }

.feature-card { isolation: isolate; }
.feature-bg { z-index: 0; position: absolute; right: -8px; bottom: -10px; height: 190px; width: auto; color: #06101a; opacity: .1; pointer-events: none; }
.feature-wide .feature-bg { height: 218px; right: 10px; }
.feature-tall .feature-bg, .feature-blue .feature-bg { color: #fff; opacity: .2; }
.feature-card > .feature-top, .feature-card > .feature-metric, .feature-card > div { position: relative; z-index: 1; }

.feature-metric-sm { font-size: clamp(34px, 3.4vw, 56px) !important; }
.feature-metric { font-size: clamp(52px, 5.5vw, 86px); line-height: 1; letter-spacing: -.07em; font-weight: 650; }
.feature-card h3 { margin: 0 0 9px; font-size: 20px; letter-spacing: -.03em; }
.feature-card p { max-width: 500px; margin: 0; color: #71808d; line-height: 1.65; font-size: 13px; }
.feature-tall p, .feature-blue p { color: rgba(255,255,255,.64); }

.product-showcase { background: #dfe7ec; }
.product-heading { margin-bottom: 58px; }
.product-heading-meta > p { max-width: 510px; margin: 0; color: #596979; font-size: 16px; line-height: 1.85; }
.product-carousel-shell { position: relative; }
.product-carousel-arrow {
  position: absolute;
  z-index: 6;
  top: 50%;
  width: 56px;
  height: 56px;
  padding: 0;
  border: 1px solid rgba(6,16,26,.28);
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  color: #17232d;
  font: 22px/1 inherit;
  cursor: pointer;
  transform: translateY(-50%);
  backdrop-filter: blur(4px);
  box-shadow: none;
  animation: carousel-arrow-in .2s ease-out;
  transition: color .2s ease, background .2s ease, border-color .2s ease, transform .2s ease;
}
.product-carousel-previous { left: 18px; }
.product-carousel-next { right: 18px; }
.product-carousel-arrow:hover { background: rgba(255,255,255,.42); border-color: rgba(6,16,26,.5); transform: translateY(-50%) scale(1.06); }
.product-carousel-arrow:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
@keyframes carousel-arrow-in { from { opacity: 0; } to { opacity: 1; } }
.product-gallery {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-width: none;
  outline: none;
}
.product-gallery::-webkit-scrollbar { display: none; }
.product-gallery:focus-visible { box-shadow: 0 0 0 2px var(--blue); }
.product-card {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  margin: 0;
  overflow: hidden;
  scroll-snap-align: start;
  background: #fff;
  border: 1px solid rgba(6,16,26,.09);
}
.product-card::after {
  content: "";
  position: absolute;
  inset: 16px;
  border: 1px solid rgba(6,16,26,.08);
  pointer-events: none;
}
.product-card img {
  width: 100%;
  height: 100%;
  padding: clamp(10px, 1.4vw, 24px);
  object-fit: contain;
  transition: transform .65s cubic-bezier(.2,.7,.2,1);
  filter: drop-shadow(0 24px 24px rgba(4,10,15,.16));
}
.product-card:hover img { transform: scale(1.035); }
.product-card:first-child img { padding: clamp(26px, 3.4vw, 58px); }
.product-card figcaption {
  position: absolute;
  z-index: 2;
  left: 30px;
  right: 30px;
  bottom: 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #17232d;
}
.product-card figcaption span { color: var(--orange); font: 11px ui-monospace, monospace; }
.product-card figcaption strong { font-size: 12px; font-weight: 720; letter-spacing: .04em; }
.product-fit-panel { margin-top: 12px; padding: clamp(32px, 5vw, 72px); background: #07101a; color: white; }
.product-fit-head { display: grid; grid-template-columns: 1fr auto; gap: 60px; align-items: end; }
.product-fit-head h3 { max-width: 820px; margin: 0; font-size: clamp(38px, 4.8vw, 70px); line-height: 1.05; letter-spacing: -.055em; font-weight: 650; }
.product-fit-head > div > p:last-child { max-width: 680px; margin: 22px 0 0; color: #8293a3; font-size: 15px; line-height: 1.75; }
.fit-weight { min-width: 190px; padding-left: 28px; border-left: 1px solid rgba(255,255,255,.16); }
.fit-weight span { display: block; margin-bottom: 8px; color: #75889b; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
.fit-weight strong { font-size: clamp(38px, 4vw, 62px); letter-spacing: -.055em; }
.fit-size-grid { margin-top: 58px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid rgba(255,255,255,.16); border-bottom: 1px solid rgba(255,255,255,.16); }
.fit-size-card { min-width: 0; padding: 30px; border-right: 1px solid rgba(255,255,255,.16); }
.fit-size-card:last-child { border-right: 0; }
.fit-size-card > span { color: var(--blue); font-size: 11px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
.fit-size-card p { margin: 8px 0 25px; color: #7e90a1; font-size: 13px; }
.fit-size-card strong { font-size: clamp(38px, 4.2vw, 64px); letter-spacing: -.06em; }
.fit-detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 12px; background: rgba(255,255,255,.12); }
.fit-detail-grid > div { min-height: 138px; padding: 27px 30px; display: flex; flex-direction: column; justify-content: center; background: #0b1621; }
.fit-detail-grid span { margin-bottom: 9px; color: #74889b; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
.fit-detail-grid strong { font-size: clamp(20px, 2vw, 29px); letter-spacing: -.035em; }
.fit-detail-grid small { margin-top: 7px; color: #8ba0b2; font-size: 11px; }
.fit-custom-note { margin: 24px 0 0; display: flex; align-items: center; gap: 12px; color: #9aabba; font-size: 13px; }
.fit-custom-note span { color: var(--orange); font-size: 9px; }
.manual-illustration { margin-top: 12px; padding: clamp(32px, 5vw, 72px); background: #f8fafb; border: 1px solid rgba(6,16,26,.09); }
.manual-illustration-head { display: grid; grid-template-columns: 1.2fr .8fr; gap: 70px; align-items: end; }
.manual-illustration-head h3 { margin: 0; font-size: clamp(38px, 4.8vw, 70px); line-height: 1.05; letter-spacing: -.055em; font-weight: 650; }
.manual-illustration-head > p { max-width: 520px; margin: 0; color: #617180; font-size: 15px; line-height: 1.8; }
.manual-drawing { margin: 48px 0 0; overflow: hidden; background: white; border: 1px solid #dce3e8; }
.manual-drawing img { width: 100%; height: auto; }
.manual-callouts { margin-top: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.manual-callouts > div { min-height: 120px; padding: 24px; display: grid; grid-template-columns: auto 1fr; align-content: center; column-gap: 16px; background: #e8eef2; }
.manual-callouts span { grid-row: 1 / span 2; color: var(--orange); font: 11px ui-monospace, monospace; }
.manual-callouts p { margin: 0 0 6px; color: #687987; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.manual-callouts strong { font-size: clamp(18px, 1.8vw, 27px); letter-spacing: -.035em; }

.workflow { display: grid; grid-template-columns: .82fr 1.18fr; gap: 8vw; background: var(--night); color: white; }
.kicker-light { color: #688199; }
.workflow-intro { position: sticky; top: 80px; align-self: start; }
.workflow-intro > p:last-child { max-width: 460px; color: #8797a7; line-height: 1.8; }
.workflow-steps { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.workflow-steps li { min-height: 150px; display: grid; grid-template-columns: 70px 1fr; align-items: center; border-bottom: 1px solid var(--line); }
.workflow-steps li > span { align-self: start; margin-top: 38px; font-size: 11px; color: var(--blue); }
.workflow-steps strong { font-size: clamp(27px, 3vw, 42px); font-weight: 520; letter-spacing: -.04em; }
.workflow-steps p { margin: 8px 0 0; color: #738394; font-size: 13px; }

.scenarios { background: #dfe8ee; }
.scenario-grid { display: grid; grid-template-columns: repeat(4, 1fr); height: min(66vw, 760px); gap: 10px; }
.scenario-card { position: relative; overflow: hidden; min-height: 480px; background: #111; }
.scenario-card img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.72) contrast(1.02); transition: transform .65s cubic-bezier(.2,.7,.2,1), filter .5s; }
.scenario-card:hover img { transform: scale(1.045); filter: saturate(1) contrast(1.02); }
.scenario-shade { position:absolute; inset:0; background:linear-gradient(180deg, rgba(3,10,16,.06) 30%, rgba(3,10,16,.9) 100%); }
.scenario-index { position:absolute; top:24px; left:24px; font: 11px ui-monospace, monospace; color:white; }
.scenario-copy { position:absolute; left:24px; right:24px; bottom:26px; color:white; }
.scenario-copy h3 { margin:0 0 7px; font-size:25px; letter-spacing:-.04em; }
.scenario-copy p { margin:0; color:#a9b8c4; font-size:12px; }

.specifications { background: #07101a; color: white; }

  <script>
    (() => {
      "use strict";
      const templates = {"en":"\u003cmain id=\"top\" lang=\"en\">\n    \u003cheader class=\"site-header\">\n      \u003ca class=\"brand\" href=\"#top\" aria-label=\"dr.ego home\">\n        \u003cimg class=\"brand-logo\" data-asset=\"logo\" alt=\"\">\n      \u003c/a>\n      \u003cnav class=\"desktop-nav\" aria-label=\"Primary navigation\">\n        \u003ca href=\"#features\">Capabilities\u003c/a>\n        \u003ca href=\"#scenarios\">Use cases\u003c/a>\n        \u003ca href=\"#specifications\">Specifications\u003c/a>\n      \u003c/nav>\n      \u003cdiv class=\"header-actions\">\n        \u003cdiv class=\"language-switch\" role=\"group\" aria-label=\"Select language\">\n          \u003cbutton type=\"button\" data-language=\"zh\" class=\"\" aria-pressed=\"false\">中\u003c/button>\n          \u003cbutton type=\"button\" data-language=\"en\" class=\"active\" aria-pressed=\"true\">EN\u003c/button>\n        \u003c/div>\n      \u003c/div>\n    \u003c/header>\n\n    \u003csection class=\"hero\" aria-labelledby=\"hero-title\">\n      \u003cdiv class=\"hero-grid\" aria-hidden=\"true\">\u003c/div>\n      \u003cdiv class=\"hero-copy\">\n        \u003cp class=\"eyebrow\">\u003cspan>\u003c/span> Physical AI Data System · DR-H01\u003c/p>\n        \u003ch1 id=\"hero-title\" aria-label=\"dr.ego\">\u003cimg class=\"hero-logo\" data-asset=\"logo\" alt=\"\">\u003c/h1>\n        \u003cp class=\"hero-lead\">Built for real-world data collection.\u003cbr>Comfort. Stability. Endurance.\u003c/p>\n        \u003cp class=\"hero-description\">A first-person stereo capture system designed for all-day wear and long-duration recording, indoors and outdoors. A custom lens delivers an ultra-wide field with ultra-low distortion, for stable, accurate capture.\u003c/p>\n        \u003cdiv class=\"hero-actions\">\n          \u003ca class=\"button-primary\" href=\"#features\">Explore capabilities \u003cspan aria-hidden=\"true\">↓\u003c/span>\u003c/a>\n          \u003ca class=\"button-ghost\" href=\"#specifications\">View specifications\u003c/a>\n        \u003c/div>\n        \u003cdiv class=\"commerce-actions\" aria-label=\"Rent or buy\">\n          \u003ca class=\"commerce-button commerce-rent\" href=\"https://ab18i04s44.feishu.cn/share/base/form/shrcnHmdxRGMmIW9ogdCJ5EITcf\" target=\"_blank\" rel=\"noreferrer\" aria-label=\"Fill in the rental and data-partnership form\">\n    \u003cspan>Apply for rental + data partnership\u003c/span>\u003ci aria-hidden=\"true\">↗\u003c/i>\n  \u003c/a>\n          \u003ca class=\"commerce-button commerce-buy\" href=\"#buy\" aria-label=\"View purchase details\">\n    \u003cspan>Buy\u003c/span>\u003ci aria-hidden=\"true\">↗\u003c/i>\n  \u003c/a>\n        \u003c/div>\n      \u003c/div>\n\n      \u003cdiv class=\"hero-visual\">\n        \u003cdiv class=\"fov-ring ring-one\" aria-hidden=\"true\">\u003c/div>\n        \u003cdiv class=\"fov-ring ring-two\" aria-hidden=\"true\">\u003c/div>\n        \u003cimg data-asset=\"hero\" alt=\"dr.ego first-person stereo data capture headset\">\n      \u003c/div>\n\n      \u003cdiv class=\"hero-metrics\" aria-label=\"Core product metrics\">\n        \u003cdiv>\u003cstrong>1080P × 2\u003c/strong>\u003cspan>Stereo RGB capture\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>60 FPS\u003c/strong>\u003cspan>High frame rate\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>132.2°\u003c/strong>\u003cspan>Wide field of view\u003c/span>\u003c/div>\n        \u003cdiv>\u003cstrong>SYNCED AUDIO\u003c/strong>\u003cspan>Full context captured\u003c/span>\u003c/div>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"signal-strip\" aria-label=\"Capture specifications\">\n      \u003cspan>STEREO RGB\u003c/span>\u003ci>\u003c/i>\u003cspan>SYNCED AUDIO\u003c/span>\u003ci>\u003c/i>\u003cspan>FOV 132.2°\u003c/span>\u003ci>\u003c/i>\u003cspan>IMU SUPPORTED\u003c/span>\u003ci>\u003c/i>\u003cspan>8-HOUR RUNTIME\u003c/span>\n    \u003c/section>\n\n    \u003csection class=\"features section-pad\" id=\"features\">\n      \u003cdiv class=\"section-heading\">\n        \u003cdiv>\u003cp class=\"kicker\">Comfort · Stability · Endurance\u003c/p>\u003ch2>Every detail tuned\u003cbr>for long-duration capture.\u003c/h2>\u003c/div>\n        \u003cp>All-day wear, sustained recording, and a natural viewing angle. From strap geometry to thermal design, dr.ego is engineered so operators forget the device is there—and the data never breaks.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"feature-grid\">\n        \u003carticle class=\"feature-card feature-wide\">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003cpath d=\"M18 38h164\"/>\u003cpath d=\"M18 38 168 126\"/>\u003cpath d=\"M62 38a44 44 0 0 1-4.5 19.5\"/>\u003cpath d=\"M18 38v88\" stroke-dasharray=\"4 7\"/>\u003ccircle cx=\"18\" cy=\"38\" r=\"3.4\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>01\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric\">30°\u003c/strong>\n          \u003cdiv>\u003ch3>30° downward tilt\u003c/h3>\u003cp>Matches the natural human view angle for accurate, stable capture while easing neck strain.\u003c/p>\u003c/div>\n        \u003c/article>        \u003carticle class=\"feature-card feature-tall\">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003cpath d=\"M8 48h22V26h26v22h26V26h26v22h26V26h26v22h26\"/>\u003cpath d=\"M8 110h22V88h26v22h26V88h26v22h26V88h26v22h26\"/>\u003cpath d=\"M30 14v112\" stroke-dasharray=\"4 7\"/>\u003cpath d=\"M108 14v112\" stroke-dasharray=\"4 7\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>02\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric\">1 ms\u003c/strong>\n          \u003cdiv>\u003ch3>Global shutter · 1 ms hard sync\u003c/h3>\u003cp>Both eyes use a global shutter with hardware-level 1 ms sync—no rolling-shutter jello, no left-right time offset.\u003c/p>\u003c/div>\n        \u003c/article>        \u003carticle class=\"feature-card \">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003crect x=\"24\" y=\"26\" width=\"152\" height=\"88\"/>\u003cpath d=\"M24 70h152M100 26v88\"/>\u003cpath d=\"M24 26q76-18 152 0\" stroke-dasharray=\"5 5\"/>\u003cpath d=\"M24 114q76 18 152 0\" stroke-dasharray=\"5 5\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>03\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric feature-metric-sm\">-6.27%\u003c/strong>\n          \u003cdiv>\u003ch3>Custom low-distortion lens\u003c/h3>\u003cp>A custom optical design holds TV distortion at -6.27%, so wide-angle frames stay straight to the edge.\u003c/p>\u003c/div>\n        \u003c/article>        \u003carticle class=\"feature-card \">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003ccircle cx=\"100\" cy=\"116\" r=\"4\"/>\u003cpath d=\"M100 116 8.6 75.5M100 116l91.4-40.5\"/>\u003cpath d=\"M8.6 75.5A100 100 0 0 1 191.4 75.5\"/>\u003cpath d=\"M34.2 86.8A72 72 0 0 1 165.8 86.8\" stroke-dasharray=\"5 6\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>04\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric feature-metric-sm\">132.2°\u003c/strong>\n          \u003cdiv>\u003ch3>132.2° ultra-wide field\u003c/h3>\u003cp>D 132.2° / H 121.6° / V 91.2°—industry-leading coverage with minimal distortion.\u003c/p>\u003c/div>\n        \u003c/article>        \u003carticle class=\"feature-card feature-wide feature-blue\">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003crect x=\"18\" y=\"40\" width=\"132\" height=\"58\" rx=\"7\"/>\u003crect x=\"154\" y=\"58\" width=\"10\" height=\"22\" rx=\"3\"/>\u003cpath d=\"M40 52v34M64 52v34M88 52v34M112 52v34\"/>\u003cpath d=\"M18 118h146\" stroke-dasharray=\"4 7\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>05\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric\">8 H\u003c/strong>\n          \u003cdiv>\u003ch3>8-hour endurance\u003c/h3>\u003cp>With a 10,000 mAh power bank, records continuously for up to 8 hours—a full work day.\u003c/p>\u003c/div>\n        \u003c/article>        \u003carticle class=\"feature-card \">\n          \u003csvg class=\"feature-bg\" viewBox=\"0 0 200 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" aria-hidden=\"true\">\u003ccircle cx=\"100\" cy=\"72\" r=\"42\"/>\u003cpath d=\"M100 30 58 98h84z\"/>\u003ccircle cx=\"100\" cy=\"30\" r=\"3.6\"/>\u003ccircle cx=\"58\" cy=\"98\" r=\"3.6\"/>\u003ccircle cx=\"142\" cy=\"98\" r=\"3.6\"/>\u003c/svg>\n          \u003cdiv class=\"feature-top\">\u003cspan>06\u003c/span>\u003cspan class=\"feature-dot\">\u003c/span>\u003c/div>\n          \u003cstrong class=\"feature-metric\">185 g\u003c/strong>\n          \u003cdiv>\u003ch3>Comfortable all day\u003c/h3>\u003cp>A lightweight, balanced build and three-point strap spread the load for all-day wear.\u003c/p>\u003c/div>\n        \u003c/article>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"product-showcase section-pad\" id=\"photos\" aria-labelledby=\"photo-gallery-title\">\n      \u003cdiv class=\"section-heading\">\n        \u003cdiv>\u003cp class=\"kicker\">Product photography\u003c/p>\u003ch2 id=\"photo-gallery-title\">The real build,\u003cbr>detail by detail.\u003c/h2>\u003c/div>\n        \u003cp>Studio photographs of the DR-H01 engineering unit—stereo module, three-point head strap, and rear compute unit exactly as assembled.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"photo-grid\">\n        \u003cfigure class=\"photo-card photo-feature\">\n          \u003cimg data-asset=\"real02\" alt=\"Front view · dr.ego DR-H01\">\n          \u003cfigcaption>\u003cspan>01\u003c/span>\u003cp>Front view · symmetrical stereo module\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure class=\"photo-card\">\n          \u003cimg data-asset=\"real01\" alt=\"Fit detail · dr.ego DR-H01\">\n          \u003cfigcaption>\u003cspan>02\u003c/span>\u003cp>Fit detail · follows the brow line\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure class=\"photo-card\">\n          \u003cimg data-asset=\"real04\" alt=\"Side profile · dr.ego DR-H01\">\n          \u003cfigcaption>\u003cspan>03\u003c/span>\u003cp>Side profile · three-point strap support\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure class=\"photo-card\">\n          \u003cimg data-asset=\"real05\" alt=\"Rear unit · dr.ego DR-H01\">\n          \u003cfigcaption>\u003cspan>04\u003c/span>\u003cp>Rear unit · cooling and counterweight\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n        \u003cfigure class=\"photo-card\">\n          \u003cimg data-asset=\"real03\" alt=\"Full form · dr.ego DR-H01\">\n          \u003cfigcaption>\u003cspan>05\u003c/span>\u003cp>Full form · lightweight wear\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n\n      \u003cdiv class=\"product-fit-panel\">\n        \u003cdiv class=\"product-fit-head\">\n          \u003cdiv>\u003cp class=\"kicker kicker-light\">One size fits all\u003c/p>\u003ch3>One size fits all.\u003c/h3>\u003cp>Both the horizontal and vertical straps adjust freely and fasten with hook-and-loop, fitting any head size.\u003c/p>\u003c/div>\n          \u003cdiv class=\"fit-weight\">\u003cspan>Total weight\u003c/span>\u003cstrong>185 g\u003c/strong>\u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"fit-detail-grid\">\n          \u003cdiv>\u003cspan>Strap length\u003c/span>\u003cstrong>25–40 cm\u003c/strong>\u003csmall>Adjustable\u003c/small>\u003c/div>\u003cdiv>\u003cspan>Downward tilt\u003c/span>\u003cstrong>30°\u003c/strong>\u003csmall>Natural view angle\u003c/small>\u003c/div>\u003cdiv>\u003cspan>Front module\u003c/span>\u003cstrong>85 × 45 × 35 mm\u003c/strong>\u003c/div>\n        \u003c/div>\n        \u003cp class=\"fit-custom-note\">\u003cspan aria-hidden=\"true\">●\u003c/span>One size fits most, with custom strap lengths and colors available.\u003c/p>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"mount-options section-pad\" id=\"mounts\">\n      \u003cdiv class=\"section-heading\">\n        \u003cdiv>\u003cp class=\"kicker\">Mounting options\u003c/p>\u003ch2>Adapted to demanding\u003cbr>working conditions.\u003c/h2>\u003c/div>\n        \u003cp>Beyond the standard head strap, dr.ego is expanding to hard hat, baseball cap, and sun visor mounts for construction, outdoor, and high-sun environments—with the same capture module.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"mount-grid\">\n        \u003cfigure class=\"mount-card\">\n          \u003cspan class=\"mount-badge mount-badge-live\">Available now\u003c/span>\n          \u003cimg data-asset=\"mountHeadband\" alt=\"Head strap · dr.ego\">\n          \u003cfigcaption>\u003cspan>01\u003c/span>\u003cstrong>Head strap\u003c/strong>\u003cp>DR-H01 · standard three-point strap, available now\u003c/p>\u003c/figcaption>\n        \u003c/figure>        \u003cfigure class=\"mount-card\">\n          \u003cspan class=\"mount-badge\">Coming soon\u003c/span>\n          \u003cimg data-asset=\"mountHardHat\" alt=\"Hard hat mount · dr.ego\">\n          \u003cfigcaption>\u003cspan>02\u003c/span>\u003cstrong>Hard hat mount\u003c/strong>\u003cp>Construction sites and industrial inspection\u003c/p>\u003c/figcaption>\n        \u003c/figure>        \u003cfigure class=\"mount-card\">\n          \u003cspan class=\"mount-badge\">Coming soon\u003c/span>\n          \u003cimg data-asset=\"mountCap\" alt=\"Baseball cap mount · dr.ego\">\n          \u003cfigcaption>\u003cspan>03\u003c/span>\u003cstrong>Baseball cap mount\u003c/strong>\u003cp>Everyday and outdoor work\u003c/p>\u003c/figcaption>\n        \u003c/figure>        \u003cfigure class=\"mount-card\">\n          \u003cspan class=\"mount-badge\">Coming soon\u003c/span>\n          \u003cimg data-asset=\"mountVisor\" alt=\"Sun visor mount · dr.ego\">\n          \u003cfigcaption>\u003cspan>04\u003c/span>\u003cstrong>Sun visor mount\u003c/strong>\u003cp>High-sun and hot environments\u003c/p>\u003c/figcaption>\n        \u003c/figure>\n      \u003c/div>\n    \u003c/section>\n\n    \u003csection class=\"workflow section-pad\">\n      \u003cdiv class=\"workflow-intro\">\n        \u003cp class=\"kicker kicker-light\">AI-native data pipeline\u003c/p>\n        \u003ch2>More than a camera. A complete data collection platform.\u003c/h2>\u003cp>dr.ego pairs the headset with software that handles recording assistance, device and project management, cloud upload, dataset organization, and quality monitoring—so captured data reaches training without manual assembly.\u003c/p>\n      \u003c/div>\n      \u003col class=\"workflow-steps\">\n        \u003cli>\u003cspan>01\u003c/span>\u003cdiv>\u003cstrong>AI-assisted recording\u003c/strong>\u003cp>On-device guidance keeps every recording session usable\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>02\u003c/span>\u003cdiv>\u003cstrong>Device management\u003c/strong>\u003cp>Provision devices, assign operators, and track project progress\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>03\u003c/span>\u003cdiv>\u003cstrong>Cloud upload\u003c/strong>\u003cp>Field recordings upload straight into your cloud storage\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>04\u003c/span>\u003cdiv>\u003cstrong>Collection links\u003c/strong>\u003cp>Share collection links to run distributed capture with external teams\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>05\u003c/span>\u003cdiv>\u003cstrong>Dataset organization\u003c/strong>\u003cp>Sessions arrive structured and ready for annotation\u003c/p>\u003c/div>\u003c/li>\u003cli>\u003cspan>06\u003c/span>\u003cdiv>\u003cstrong>Quality monitoring\u003c/strong>\u003cp>Automatic checks flag frame drops, exposure, and coverage gaps\u003c/p>\u003c/div>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection class=\"scenarios section-pad\" id=\"scenarios\">\n      \u003cdiv class=\"section-heading scenario-heading\">\n        \u003cdiv>\u003cp class=\"kicker\">Designed for real-world work\u003c/p>\u003ch2>Designed for real-world work.\u003cbr>Wherever the task happens.\u003c/h2>\u003c/div>\n        \u003cp>The hands-free form factor already covers industrial assembly, manufacturing, warehousing, automotive repair, laboratory, field operations, retail, and agriculture.\u003c/p>\n      \u003c/div>\n      \u003cdiv class=\"scenario-grid\">\n        \u003carticle class=\"scenario-card\">\n          \u003cimg data-asset=\"industrial\" alt=\"Industrial assembly · dr.ego\" style=\"object-position:center 44%\">\n          \u003cdiv class=\"scenario-shade\">\u003c/div>\u003cspan class=\"scenario-index\">01\u003c/span>\n          \u003cdiv class=\"scenario-copy\">\u003ch3>Industrial assembly\u003c/h3>\u003cp>Assembly lines, manufacturing, and automotive repair\u003c/p>\u003c/div>\n        \u003c/article>\u003carticle class=\"scenario-card\">\n          \u003cimg data-asset=\"lab\" alt=\"Laboratory · dr.ego\" style=\"object-position:center 42%\">\n          \u003cdiv class=\"scenario-shade\">\u003c/div>\u003cspan class=\"scenario-index\">02\u003c/span>\n          \u003cdiv class=\"scenario-copy\">\u003ch3>Laboratory\u003c/h3>\u003cp>Experimental procedures and instrument handling\u003c/p>\u003c/div>\n        \u003c/article>\u003carticle class=\ 5 g body · one-size three-point head strap\u003c/li>\u003c/ul>\n      \u003cdiv class=\"buy-actions\">\n        \u003ca class=\"commerce-button commerce-buy\" href=\"#reserve-buy\">\u003cspan>Reserve a purchase\u003c/span>\u003cstrong>RESERVATION FORM\u003c/strong>\u003ci aria-hidden=\"true\">↗\u003c/i>\u003c/a>\n        \u003ca class=\"button-ghost\" href=\"#specifications\">View full specifications\u003c/a>\n      \u003c/div>\n      \u003cdl class=\"buy-meta\">\u003cdiv>\u003cdt>Lead time\u003c/dt>\u003cdd>Ships 2–4 weeks after order\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Warranty\u003c/dt>\u003cdd>12-month hardware warranty\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>In the box\u003c/dt>\u003cdd>Headset · cable · carrying case\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Support\u003c/dt>\u003cdd>Platform account and onboarding\u003c/dd>\u003c/div>\u003cdiv>\u003cdt>Contact\u003c/dt>\u003cdd>WeChat n17737706577\u003c/dd>\u003c/div>\u003c/dl>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>","reserveZh":"\u003cmain class=\"reserve-page\" lang=\"zh-CN\">\n  \u003cheader class=\"reserve-header\">\n    \u003ca class=\"brand\" href=\"#top\" aria-label=\"dr.ego 首页\">\u003cimg class=\"brand-logo\" data-asset=\"logo\" alt=\"\">\u003c/a>\n    \u003ca class=\"reserve-back\" href=\"#top\">← 返回产品页\u003c/a>\n  \u003c/header>\n  \u003cdiv class=\"reserve-main\">\n    \u003csection class=\"reserve-copy\" aria-labelledby=\"reserve-title\">\n      \u003cp class=\"kicker kicker-light\">租赁与购买预约\u003c/p>\n      \u003ch1 id=\"reserve-title\">把真实世界数据\u003cbr>接入训练流程。\u003c/h1>\n      \u003cp>告诉我们你计划如何使用 dr.ego，我们会回复现货情况、配置选项、交付周期以及租赁或购买报价。\u003c/p>\n      \u003cdiv class=\"reserve-contact\">\u003cspan>直接联系\u003c/span>\u003ca href=\"mailto:info@deepreach.ai\">info@deepreach.ai\u003c/a>\u003c/div>\n    \u003c/section>\n    \u003csection class=\"reserve-form-shell\" id=\"reservation-form\" aria-labelledby=\"form-title\">\n      \u003ch2 id=\"form-title\">提交预约申请\u003c/h2>\n      \u003cp>选择预约类型并简单描述项目情况，带 * 为必填项。\u003c/p>\n      \u003cform id=\"reservation-email-form\">\n        \u003cdiv class=\"intent-grid\" role=\"radiogroup\" aria-label=\"预约类型\">\n          \u003clabel class=\"intent-option\">\u003cinput type=\"radio\" name=\"intent\" value=\"rent\">\u003cspan>\u003cstrong>租赁 dr.ego\u003c/strong>短期项目与试用\u003c/span>\u003c/label>\n          \u003clabel class=\"intent-option\">\u003cinput type=\"radio\" name=\"intent\" value=\"buy\">\u003cspan>\u003cstrong>购买 dr.ego\u003c/strong>规模化部署\u003c/span>\u003c/label>\n        \u003c/div>\n        \u003cdiv class=\"form-grid\">\n          \u003cdiv class=\"form-field\">\u003clabel for=\"name\">姓名 *\u003c/label>\u003cinput id=\"name\" name=\"name\" autocomplete=\"name\" required placeholder=\"你的姓名\">\u003c/div>\n          \u003cdiv class=\"form-field\">\u003clabel for=\"email\">工作邮箱 *\u003c/label>\u003cinput id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" required placeholder=\"name@company.com\">\u003c/div>\n          \u003cdiv class=\"form-field\">\u003clabel for=\"company\">公司 / 机构 *\u003c/label>\u003cinput id=\"company\" name=\"company\" autocomplete=\"organization\" required placeholder=\"机构名称\">\u003c/div>\n          \u003cdiv class=\"form-field\">\u003clabel for=\"region\">所在地区 *\u003c/label>\u003cinput id=\"region\" name=\"region\" autocomplete=\"country-name\" required placeholder=\"城市或国家\">\u003c/div>\n          \u003cdiv class=\"form-field\">\u003clabel for=\"quantity\">预计数量\u003c/label>\u003cinput id=\"quantity\" name=\"quantity\" type=\"number\" min=\"1\" inputmode=\"numeric\" placeholder=\"1\">\u003c/div>\n          \u003cdiv class=\"form-field\">\u003clabel for=\"timeline\">计划时间\u003c/label>\u003cselect id=\"timeline\" name=\"timeline\">\u003coption value=\"\" disabled selected>选择时间范围\u003c/option>\u003coption>1 个月内\u003c/option>\u003coption>1–3 个月\u003c/option>\u003coption>3–6 个月\u003c/option>\u003coption>6 个月以上\u003c/option>\u003c/select>\u003c/div>\n          \u003cdiv class=\"form-field form-field-full\">\u003clabel for=\"details\">项目情况\u003c/label>\u003ctextarea id=\"details\" name=\"details\" placeholder=\"使用场景、采集环境、技术需求，以及想咨询的问题。\">\u003c/textarea>\u003c/div>\n        \u003c/div>\n        \u003cbutton class=\"reserve-submit\" type=\"submit\">生成预约邮件 ↗\u003c/button>\n        \u003cp class=\"reserve-form-note\">提交后会打开邮件应用并预填内容，你可以确认后发送给 DeepReach 团队。\u003c/p>\n      \u003c/form>\n    \u003c/section>\n  \u003c/div>\n\u003c/main>"};
      const assets = (window.__resources || {"nextCap":"media/dr-ego-next-cap.webp","nextWrist":"media/dr-ego-next-wrist.webp","logo":"media/dr-ego-logo.webp","hero":"media/dr-ego-hero.webp","productFront":"media/dr-ego-product-front.webp","industrial":"media/dr-ego-industrial.webp","lab":"media/dr-ego-lab.webp","retail":"media/dr-ego-retail.webp","care":"media/dr-ego-care.webp","productSide":"media/dr-ego-product-side.webp","mountHeadband":"media/dr-ego-mount-headband.webp","mountHardHat":"media/dr-ego-mount-hardhat.webp","mountCap":"media/dr-ego-mount-cap.webp","mountVisor":"media/dr-ego-mount-visor.webp","frontStrap":"media/dr-ego-front-strap.webp","real01":"media/dr-ego-real-01.webp","real02":"media/dr-ego-real-02.webp","real03":"media/dr-ego-real-03.webp","real04":"media/dr-ego-real-04.webp","real05":"media/dr-ego-real-05.webp"});
      const app = document.getElementById("app");
      let currentView = "";
      let language = "en";

      try {
        language = localStorage.getItem("dr-ego-language") === "zh" ? "zh" : "en";
      } catch (_) {}

      const attachAssets = () => {
        app.querySelectorAll("[data-asset]").forEach((image) => {
          image.src = assets[image.dataset.asset];
        });
      };

      const attachProductCarousel = () => {
        const gallery = app.querySelector(".product-gallery");
        if (!gallery) return;
        const previous = app.querySelector(".product-carousel-previous");
        const next = app.querySelector(".product-carousel-next");

        const updateNavigation = () => {
          const maxScroll = Math.max(0, gallery.scrollWidth - gallery.clientWidth);
          if (previous) previous.hidden = gallery.scrollLeft <= 4;
          if (next) next.hidden = gallery.scrollLeft >= maxScroll - 4;
        };

        app.querySelectorAll("[data-carousel-direction]").forEach((button) => {
          button.addEventListener("click", () => {
            const direction = Number(button.dataset.carouselDirection);
            gallery.scrollBy({ left: gallery.clientWidth * 0.86 * direction, behavior: "smooth" });
          });
        });
        gallery.addEventListener("scroll", updateNavigation, { passive: true });
        window.addEventListener("resize", updateNavigation, { passive: true });
        requestAnimationFrame(updateNavigation);
      };

      function onLightboxKey(event) { if (event.key === "Escape") closeLightbox(); }

      const closeLightbox = () => {
        const box = document.querySelector(".lightbox");
        if (box) box.remove();
        document.removeEventListener("keydown", onLightboxKey);
      };

      const attachLightbox = () => {
        app.querySelectorAll(".product-card img, .mount-card img, .photo-card img").forEach((image) => {
          image.addEventListener("click", () => {
            closeLightbox();
            const box = document.createElement("div");
            box.className = "lightbox";
            box.setAttribute("role", "dialog");
            box.setAttribute("aria-modal", "true");
            const large = document.createElement("img");
            large.src = image.src;
            large.alt = image.alt;
            const close = document.createElement("button");
            close.type = "button";
            close.className = "lightbox-close";
            close.setAttribute("aria-label", language === "zh" ? "关闭" : "Close");
            close.textContent = "\u2715";
            const caption = document.createElement("p");
            caption.className = "lightbox-caption";
            caption.textContent = image.alt;
            box.appendChild(large);
            box.appendChild(close);
            box.appendChild(caption);
            box.addEventListener("click", (event) => { if (event.target !== large) closeLightbox(); });
            document.body.appendChild(box);
            document.addEventListener("keydown", onLightboxKey);
          });
        });
      };

      const saveLanguage = (nextLanguage) => {
        language = nextLanguage === "zh" ? "zh" : "en";
        try { localStorage.setItem("dr-ego-language", language); } catch (_) {}
        renderHome();
        window.scrollTo(0, 0);
      };

      const prepareEmail = (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const data = new FormData(form);
        const intent = String(data.get("intent") || "rent");
        const company = String(data.get("company") || "");
        const zh = language === "zh";
        const kind = zh ? (intent === "rent" ? "租赁" : "购买") : (intent === "rent" ? "Rental" : "Purchase");
        const subject = zh
          ? "dr.ego " + kind + "预约" + (company ? " — " + company : "")
          : "dr.ego " + kind + " Reservation" + (company ? " — " + company : "");
        const labels = zh
          ? ["您好，DeepReach 团队：", "我希望预约 dr.ego：", "姓名：", "公司 / 机构：", "工作邮箱：", "所在地区：", "预计数量：", "计划时间：", "项目情况："]
          : ["Hello DeepReach team,", "I would like to reserve dr.ego for: ", "Name: ", "Company / organization: ", "Work email: ", "Country / region: ", "Expected quantity: ", "Target timeline: ", "Project details:"];
        const body = [
          labels[0], "",
          labels[1] + kind,
          labels[2] + String(data.get("name") || ""),
          labels[3] + company,
          labels[4] + String(data.get("email") || ""),
          labels[5] + String(data.get("region") || ""),
          labels[6] + String(data.get("quantity") || ""),
          labels[7] + String(data.get("timeline") || ""),
          "", labels[8], String(data.get("details") || "")
        ].join("\n");
        window.location.href = "mailto:info@deepreach.ai?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      };

      const renderHome = () => {
        currentView = "home";
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        app.innerHTML = templates[language];
        attachAssets();
        attachProductCarousel();
        attachLightbox();
        app.querySelectorAll("[data-language]").forEach((button) => {
          button.addEventListener("click", () => saveLanguage(button.dataset.language));
        });
      };

      const renderReserve = (intent) => {
        currentView = "reserve";
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        app.innerHTML = language === "zh" ? templates.reserveZh : templates.reserve;
        attachAssets();
        const radio = app.querySelector('input[name="intent"][value="' + intent + '"]');
        if (radio) radio.checked = true;
        app.querySelector("#reservation-email-form").addEventListener("submit", prepareEmail);
        requestAnimationFrame(() => app.querySelector("#reservation-form")?.scrollIntoView({ block: "start" }));
      };

      const attachBuyGallery = () => {
        const track = app.querySelector(".buy-track");
        if (!track) return;
        const dots = Array.prototype.slice.call(app.querySelectorAll(".buy-dot"));
        const prev = app.querySelector(".buy-arrow-prev");
        const next = app.querySelector(".buy-arrow-next");
        const update = () => {
          const index = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
          dots.forEach((dot, n) => dot.classList.toggle("active", n === index));
          const max = Math.max(0, track.scrollWidth - track.clientWidth);
          if (prev) prev.hidden = track.scrollLeft <= 4;
          if (next) next.hidden = track.scrollLeft >= max - 4;
        };
        app.querySelectorAll("[data-buy-dir]").forEach((button) => {
          button.addEventListener("click", () => track.scrollBy({ left: track.clientWidth * Number(button.dataset.buyDir), behavior: "smooth" }));
        });
        dots.forEach((dot, n) => dot.addEventListener("click", () => track.scrollTo({ left: track.clientWidth * n, behavior: "smooth" })));
        track.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update, { passive: true });
        requestAnimationFrame(update);
      };

      const renderBuy = () => {
        currentView = "buy";
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
        app.innerHTML = language === "zh" ? templates.buyZh : templates.buyEn;
        attachAssets();
        attachBuyGallery();
        window.scrollTo(0, 0);
      };

      const route = () => {
        if (location.hash === "#buy") return renderBuy();
        if (location.hash === "#reserve-rent") return renderReserve("rent");
        if (location.hash === "#reserve-buy") return renderReserve("buy");
        if (currentView !== "home") renderHome();
        if (location.hash && location.hash !== "#top") {
          requestAnimationFrame(() => document.querySelector(location.hash)?.scrollIntoView());
        } else if (location.hash === "#top") {
          requestAnimationFrame(() => window.scrollTo(0, 0));
        }
      };

      window.addEventListener("hashchange", route);
      route();
    })();
  </script>
